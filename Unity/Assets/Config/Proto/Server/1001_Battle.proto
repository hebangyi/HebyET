// ResponseType B2L_PlayerStartMatch
message L2B_PlayerStartMatch // IRequest
{
	int32 RpcId = 1;
    int64 PlayerId = 2;
	ActorId ActorId = 3;		// 玩家ActorId
}

message B2L_PlayerStartMatch // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message L2B_PlayerMatchSuccessNotify // IMessage
{
	int64 worldId = 1;	// 世界ID
}