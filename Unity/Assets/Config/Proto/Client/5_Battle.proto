//// 战斗流程

// 1.开始匹配战斗
// ResponseType L2C_StartMatchBattle
message C2L_StartMatchBattle // IClientRequest
{
	int32 RpcId = 1;
	// TODO 各个战斗服的ping值
}

message L2C_StartMatchBattle // IClientResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


// 2.通知匹配成功
message L2C_MatchBattleSuccess // IMessage
{
	string RouterAddress = 1;	// 路由地址
	string BattleAddress = 2;	// 战斗服地址
	string Token = 3;			// Token
}