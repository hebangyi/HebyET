//// 客户端Main向网络线程发送消息
// ResponseType NetBattle2MainLogin
message Main2NetBattleLogin // IRequest
{
	int32 RpcId = 1;
	int32 OwnerFiberId = 2;
	string RouterAddress = 3;				// 路由地址
	string Address = 3;						// 地址
	string Token = 4;						// Token 令牌	
}

message NetBattle2MainLogin // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


// 3.玩家进入战斗 对Session 进行登录验证
// ResponseType B2C_Login
message C2B_Login // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
}

message B2C_Login // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 4.玩家通知准备完成
// ResponseType B2C_PlayerReadyCompleted
message C2B_PlayerReadyCompleted
{
	int32 RpcId = 1;
}

message B2C_PlayerReadyCompleted
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}