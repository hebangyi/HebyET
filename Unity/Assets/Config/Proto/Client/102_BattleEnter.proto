//// 进入战斗流程

// 3.玩家进入战斗 对Session 进行登录验证
message C2B_PlayerEnterBattle // ISessionRequest
{
	int32 RpcId = 1;
	string Token = 2;
}

message B2C_PlayerEnterBattle // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 4.玩家通知准备完成
message C2B_PlayerReadyCompleted
{
	int32 RpcId = 1;
}

message B2C_PlayerReadyCompleted
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}